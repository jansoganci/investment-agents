# settings.yaml — the one place for models, budget, hours and paths (AGENTS.md, roadmap section 4).
# Secrets never go here; they live in .env (template: .env.example).
# Machine-specific paths (the Drive folder) also come from .env.

timezone: Europe/Istanbul          # times are stored in UTC and shown in Turkey time (roadmap section 5)

paths:
  data_dir: ~/investment-agents-data   # SQLite lives here, never in Drive; override with DATA_DIR in .env
  database: investment-agents.sqlite
  # The Drive root (`Investing/`) comes from DRIVE_DIR in .env.

database:
  busy_timeout_ms: 5000            # a second writer waits a few seconds instead of failing (WAL mode)
  ask_time_limit_s: 5              # a free question (shared.ask) is stopped after this many seconds

backup:
  keep_daily: 7                    # roadmap section 5: the last 7 daily copies …
  keep_weekly: 4                   # … and the last 4 weekly copies, in Investing/Backup/

hours:                             # Turkey time; the Hermes jobs are listed in docs/SCHEDULE.md
  prices: "03:00"                  # the one nightly price job (previous day's close)
  backup: "04:00"                  # after the prices; move it if the price job runs longer than an hour
  eye: ["07:00", "13:00", "20:00"] # agent 1, 3 passes a day
  alerts: "every hour at :05"      # python -m shared.alerts
  sunday: "09:00"                  # the Sunday chain: Counter → Research → Analysis → Portfolio → the summary
  bulletin: "08:15"                # the morning bulletin, weekdays only: the time it should ARRIVE (roadmap "Morning bulletin" 1); the Hermes job starts at 08:10 because it runs about 3.5 minutes

warnings:                          # /status (phase 6)
  stuck_job_hours: 1               # a job in `running` longer than this
  backup_max_hours: 36             # a backup older than this

# Sector before the Eye exists: from the SEC industry code (shared/sectors.py). Correct a wrong one here, e.g.
#   sector_overrides: {SNAP: Communication Services}
sector_overrides:
  GE: Industrials                  # SIC 3600 (electrical equipment) → the table says Information Technology
  MMM: Industrials                 # SIC 3841 (medical instruments) → the table says Health Care

# Makers with their own lending arm: their debt mostly funds customers' loans, so the debt measures look too bad. The card gets
# a `finance_arm` warning (nothing is recomputed). Add a ticker here when you meet one (roadmap rule 49).
finance_arm: [DE, CAT, F, GM, HOG, PCAR, CNH]

eye:                               # agent 1
  extract_companies: true          # a cheap model lists the companies a post is about (roadmap Agent 1 rule 20); on since 2026-10-30 after the 50-post trial and `--fill`
  skip_sites: [dragonomi]          # sites the pass does not touch at all (no membership yet, 2026-10-12): no sitemap, no note, no waiting list.
                                   # Remove the name when its cookie is in .env (the posts it missed are then read; `--accept-many` if > 200).
counter:                           # 1B (roadmap "Agent 1B rules" 6): starting values, adjusted after the first weeks
  window_days: 7
  long_days: 30
  top: 10                          # stocks shown / handed to agent 2
  card_mention_bar: 6              # a stock that already has a card is "mentioned a lot" at this many posts in the window
  non_us_ignore: []                # non-US names the Sunday summary must not ask documents for (the `key` of the Counter row, e.g. 2222.SR)
  mention_points: [3, 6]           # `mentions` score: below the first = 0, from the first = 1, from the second = 2

research:                          # agent 2 (roadmap "Agent 2 rules" 8)
  web_search_uses: 5               # most searches in one news call
  commodity_search_uses: 3
  event_max_age_days: 365          # a serious negative older than this does not count
  positive_max_age_days: 90        # an important positive older than this does not count (my decision, 2026-10-14: FCX scored 2 on an 8-month-old item)
  page_max_bytes: 2000000          # a source page is cut here before the quote is looked for

bulletin:                          # the morning bulletin (roadmap "Morning bulletin"; docs/BULLETIN_PLAN.md)
  max_searches: 25                 # most DeepSeek searches in one bulletin (one per stock I hold or watch, one per interest)
  post_chars: 3000                 # how much of one post's text goes to the model …
  full_posts: 40                   # … for this many posts (the ones about my stocks first, then the newest); the rest go in with title and one sentence
  search_count: 5                  # hits asked from each web search
  earnings_days: 45                # my stocks' earnings dates are listed this far ahead
  market:                          # the figures table, in this order: last close, 1-month and day change (`kind: yield` → basis points)
    - {label: "S&P 500",    symbol: "^GSPC"}
    - {label: "Nasdaq",     symbol: "^IXIC"}
    - {label: "ABD 10Y",    symbol: "^TNX", kind: yield}
    - {label: "Japonya 10Y", symbol: "JP10Y", kind: yield}   # not on Yahoo: Japan's Ministry of Finance file (slice 2)
    - {label: "Altın",      symbol: "GC=F"}
    - {label: "Brent",      symbol: "BZ=F"}
    - {label: "DXY",        symbol: "DX-Y.NYB"}
    - {label: "USDJPY",     symbol: "JPY=X"}
    - {label: "EURJPY",     symbol: "EURJPY=X"}
    - {label: "CHFJPY",     symbol: "CHFJPY=X"}
  interests:                       # my topics (my decision, 2026-10-28): one English search each
    - {topic: markets and direction, query: "stock market outlook week"}
    - {topic: oil,                   query: "Brent crude oil supply OPEC Iran"}
    - {topic: dollar and rates,      query: "Fed Treasury yields dollar index"}
    - {topic: japan,                 query: "Bank of Japan JGB yield yen"}
    - {topic: ai infrastructure,     query: "AI data center capex semiconductors"}
    - {topic: memory and hbm,        query: "HBM DRAM memory prices supply"}
    - {topic: optical parts,         query: "optical transceiver data center market"}
    - {topic: calendar,              query: "earnings calendar central bank meetings this week"}

# Yahoo symbols of the commodities a stock can be linked to (the model must pick from these names; roadmap "Agent 2 rules" 8)
commodity_symbols:
  crude oil: CL=F
  natural gas: NG=F
  gold: GC=F
  silver: SI=F
  copper: HG=F
  platinum: PL=F
  palladium: PA=F
  corn: ZC=F
  wheat: ZW=F
  soybeans: ZS=F
  sugar: SB=F
  coffee: KC=F
  cocoa: CC=F
  cotton: CT=F
  lumber: LBR=F
  cattle: LE=F
  hogs: HE=F
  uranium: URA        # an ETF: Yahoo has no uranium future

portfolio:
  goal_usd: 800000                 # total wealth goal (agent 4 rule 4)
  dividend_withholding: 0.20       # 20%, user-confirmed (agent 4 rule 1)

budget:
  ai_monthly_max_usd: 30           # roadmap section 6: at most 25–30 $ / month
  openrouter_monthly_limit_usd: 15 # set in the OpenRouter dashboard, not from Telegram
  openrouter_warning_usd: 10       # Telegram warning

# Models and providers — roadmap section 10.1, copied as decided (2026-10-04).
# Each job tries its list in order: my API credits first, then OpenRouter.
# A Telegram override (/model) lives in the Air database (`settings` table), not here.
models:
  cheap:        # agent 1's one sentence, new-tag classification, making Telegram messages plain
    - {provider: deepseek,   model: deepseek-v4-flash}
    - {provider: openrouter, model: deepseek/deepseek-v4-flash}
  strong:       # agent 2 (tone, news flow, score reasons), agent 3 (why answers, thesis, drop-alert check)
    # Order (my decision, 2026-10-18): the Anthropic credit ended 2026-10-19 and I do not top it up this month, so DeepSeek V4 Pro
    # is first, GPT-6 Sol high second, Claude Sonnet 5.5 high last (a fallback again once I put 10 $ on it next month); then the
    # same three through OpenRouter. Web search works only through Anthropic (the news step says "unclear" while it has no credit).
    - {provider: deepseek,   model: deepseek-v4-pro}
    - {provider: openai,     model: gpt-6-sol, effort: high}
    - {provider: anthropic,  model: claude-sonnet-5-5, effort: high}
    - {provider: openrouter, model: deepseek/deepseek-v4-pro}
    - {provider: openrouter, model: openai/gpt-6-sol, effort: high}
    - {provider: openrouter, model: anthropic/claude-sonnet-5.5, effort: high}
  auditor:      # agents 2 and 3. The same order as the writer (my decision, 2026-10-09; the order changed 2026-10-18, see above)
    - {provider: deepseek,   model: deepseek-v4-pro}
    - {provider: openai,     model: gpt-6-sol, effort: high}
    - {provider: anthropic,  model: claude-sonnet-5-5, effort: high}
    - {provider: openrouter, model: deepseek/deepseek-v4-pro}
    - {provider: openrouter, model: openai/gpt-6-sol, effort: high}
    - {provider: openrouter, model: anthropic/claude-sonnet-5.5, effort: high}
  hermes_chat:  # set in Hermes itself, listed here for reference
    - {provider: openai-codex, model: chatgpt-subscription}
    - {provider: deepseek,     model: deepseek-v4-pro}

# AI client (phase 2, roadmap "Agent 3's AI parts — how phase 2 builds them")
ai:
  excerpt_chars: 12000             # at most this much of a filing goes to a model per call
  row_chars: 4000                  # of that, the figure audit's rows found by our figures' values (roadmap rule 41)
  min_quote_chars: 20              # a shorter quote proves nothing and is not accepted
  max_tokens: 16000                # one answer (the model's thinking counts too)
  timeout_s: 180
  audit_sample: 5                  # a random 1 in 5 routine updates is audited

# Price per million tokens in dollars, by model name (input = the full input price: cheaper cache reads are not assumed, so the
# count is on the cautious side). A model not listed is counted at `default` and shown as "estimated" in /spend.
pricing:
  claude-sonnet-5-5:   {input: 2.00,  output: 10.00}
  claude-opus-5-5:     {input: 4.00,  output: 20.00}
  deepseek-v4-flash:   {input: 0.30,  output: 1.20}     # DeepSeek's page, 2026-10-09: peak price (off-peak is half); served by V4.1 Flash
  deepseek-v4-pro:     {input: 1.32,  output: 3.96}     # DeepSeek's page, 2026-10-09: peak price (off-peak is half)
  gpt-6-sol:           {input: 2.00,  output: 10.00}    # OpenAI's page, 2026-10-09
  default:             {input: 5.00,  output: 25.00}    # cautious: above every model above
  web_search_per_call: 0.01                                     # Anthropic's web search: $10 per 1,000 searches
  deepseek_search_per_call: 0.00075                             # DeepSeek's Search API: $0.75 per 1,000 successful searches; an empty answer is free

# Short names for /analyze KO opus-5.5 and /model strong gpt-6-sol (a one-off or stored override).
model_aliases:
  opus-5.5:   {provider: anthropic, model: claude-opus-5-5, effort: high}
  sonnet-5.5: {provider: anthropic, model: claude-sonnet-5-5, effort: high}
  gpt-6-sol:  {provider: openai, model: gpt-6-sol, effort: high}
  deepseek-v4-pro:   {provider: deepseek, model: deepseek-v4-pro}
  deepseek-v4-flash: {provider: deepseek, model: deepseek-v4-flash}
