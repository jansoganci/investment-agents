# settings.yaml — the one place for models, budget, hours and paths (AGENTS.md, roadmap section 4).
# Secrets never go here; they live in .env (template: .env.example).
# Machine-specific paths (the Drive folder) also come from .env.

timezone: Europe/Istanbul          # times are stored in UTC and shown in Turkey time (roadmap section 5)

paths:
  data_dir: ~/investment-agents-data   # SQLite lives here, never in Drive; override with DATA_DIR in .env
  database: investment-agents.sqlite
  # The Drive root (`Investing/`) comes from DRIVE_DIR in .env.

database:
  busy_timeout_ms: 5000            # a second writer waits a few seconds instead of failing (WAL mode)
  ask_time_limit_s: 5              # a free question (shared.ask) is stopped after this many seconds

backup:
  keep_daily: 7                    # roadmap section 5: the last 7 daily copies …
  keep_weekly: 4                   # … and the last 4 weekly copies, in Investing/Backup/

hours:                             # Turkey time
  prices: "03:00"                  # the one nightly price job (previous day's close)
  backup: after prices
  eye: ["07:00", "13:00", "20:00"] # agent 1, 3 passes a day

# Sector before the Eye exists: from the SEC industry code (shared/sectors.py). Correct a wrong one here, e.g.
#   sector_overrides: {SNAP: Communication Services}
sector_overrides:
  GE: Industrials                  # SIC 3600 (electrical equipment) → the table says Information Technology
  MMM: Industrials                 # SIC 3841 (medical instruments) → the table says Health Care

portfolio:
  goal_usd: 800000                 # total wealth goal (agent 4 rule 4)
  dividend_withholding: 0.20       # 20%, user-confirmed (agent 4 rule 1)

budget:
  ai_monthly_max_usd: 30           # roadmap section 6: at most 25–30 $ / month
  openrouter_monthly_limit_usd: 15 # set in the OpenRouter dashboard, not from Telegram
  openrouter_warning_usd: 10       # Telegram warning

# Models and providers — roadmap section 10.1, copied as decided (2026-10-04).
# Each job tries its list in order: my API credits first, then OpenRouter.
# A Telegram override (/model) lives in the Air database (`settings` table), not here.
models:
  cheap:        # agent 1's one sentence, new-tag classification, making Telegram messages plain
    - {provider: deepseek,   model: deepseek-v4-flash}
    - {provider: openrouter, model: deepseek/deepseek-v4-flash}
  strong:       # agent 2 (tone, news flow, score reasons), agent 3 (why answers, thesis, drop-alert check)
    # Order (my decision, 2026-10-09): Claude Sonnet 5.5 high always first, then DeepSeek V4 Pro, then GPT-6 Sol high;
    # my API credits first, then the same three through OpenRouter. The auditor skips the writer's family on its own.
    - {provider: anthropic,  model: claude-sonnet-5-5, effort: high}
    - {provider: deepseek,   model: deepseek-v4-pro}
    - {provider: openai,     model: gpt-6-sol, effort: high}
    - {provider: openrouter, model: anthropic/claude-sonnet-5.5, effort: high}
    - {provider: openrouter, model: deepseek/deepseek-v4-pro}
    - {provider: openrouter, model: openai/gpt-6-sol, effort: high}
  auditor:      # agents 2 and 3. My decision (2026-10-09): the same order as the writer, Sonnet 5.5 high first — the
                # "different family from the writer" rule is dropped (roadmap 10.1)
    - {provider: anthropic,  model: claude-sonnet-5-5, effort: high}
    - {provider: deepseek,   model: deepseek-v4-pro}
    - {provider: openai,     model: gpt-6-sol, effort: high}
    - {provider: openrouter, model: anthropic/claude-sonnet-5.5, effort: high}
    - {provider: openrouter, model: deepseek/deepseek-v4-pro}
    - {provider: openrouter, model: openai/gpt-6-sol, effort: high}
  hermes_chat:  # set in Hermes itself, listed here for reference
    - {provider: openai-codex, model: chatgpt-subscription}
    - {provider: deepseek,     model: deepseek-v4-pro}

# AI client (phase 2, roadmap "Agent 3's AI parts — how phase 2 builds them")
ai:
  excerpt_chars: 12000             # at most this much of a filing goes to a model per call
  row_chars: 4000                  # of that, the figure audit's rows found by our figures' values (roadmap rule 41)
  min_quote_chars: 20              # a shorter quote proves nothing and is not accepted
  max_tokens: 16000                # one answer (the model's thinking counts too)
  timeout_s: 180
  audit_sample: 5                  # a random 1 in 5 routine updates is audited

# Price per million tokens in dollars, by model name (input = the full input price: cheaper cache reads are not assumed, so the
# count is on the cautious side). A model not listed is counted at `default` and shown as "estimated" in /spend.
pricing:
  claude-sonnet-5-5:   {input: 2.00,  output: 10.00}
  claude-opus-5-5:     {input: 4.00,  output: 20.00}
  deepseek-v4-flash:   {input: 0.30,  output: 1.20}     # DeepSeek's page, 2026-10-09: peak price (off-peak is half); served by V4.1 Flash
  deepseek-v4-pro:     {input: 1.32,  output: 3.96}     # DeepSeek's page, 2026-10-09: peak price (off-peak is half)
  gpt-6-sol:           {input: 2.00,  output: 10.00}    # OpenAI's page, 2026-10-09
  default:             {input: 5.00,  output: 25.00}    # cautious: above every model above

# Short names for /analyze KO opus-5.5 and /model strong gpt-6-sol (a one-off or stored override).
model_aliases:
  opus-5.5:   {provider: anthropic, model: claude-opus-5-5, effort: high}
  sonnet-5.5: {provider: anthropic, model: claude-sonnet-5-5, effort: high}
  gpt-6-sol:  {provider: openai, model: gpt-6-sol, effort: high}
  deepseek-v4-pro:   {provider: deepseek, model: deepseek-v4-pro}
  deepseek-v4-flash: {provider: deepseek, model: deepseek-v4-flash}
