[project]
name = "investment-agents"
version = "0.1.0"
description = "Personal investment-advisor agents: read, research, analyze, suggest. The user decides."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=1.11.0",
    "openai>=3.24.0",
    "yfinance>=1.7.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.15.1",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
